name: rabbit-skills
version: 0.20.0
description: 轻量、松弛的 Agent 配置套件。适合中等规模的 AI 原生项目。

author:
  name: john-walks-slow

license: MIT

keywords:
  - ai-coding
  - agent-rules
  - coding-conventions
  - workflow
  - agent-skills

type: hybrid

# 只能声明 APM 用户级安装支持的 runtime：声明没有用户级部署目录（或需要实验性
# 开关）的 target 会让 `apm install -g` 整次失败（Unknown target）。
# 完整 runtime 清单（release 产物与官网展示）见 scripts/targets.mjs。
targets:
  - copilot
  - claude
  - cursor
  - opencode
  - codex
  - gemini
  - windsurf
  - kiro
  - antigravity
  - grok-build
  - hermes
  - vscode
  - agent-skills

includes: auto

scripts:
  compile: apm compile
  pack: apm pack
  install-global: apm install -g john-walks-slow/rabbit-skills
  audit: apm audit --ci
  build-release: node scripts/build-release.mjs
  website: npm --prefix website run build
