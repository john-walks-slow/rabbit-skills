name: Release
on:
  push:
    tags: 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install APM CLI
        run: curl -sSL https://aka.ms/apm-unix | sudo sh
      - name: Build release
        run: apm run build-release
      - name: Package per-tool archives
        run: |
          mkdir -p dist
          for dir in release/*/; do
            tool=$(basename "$dir")
            (cd release && zip -r "../dist/rabbit-skills-${tool}.zip" "$tool")
          done
      - name: Create GitHub release
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
